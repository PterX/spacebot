# docker-compose.yml — Coolify deploy for Spacebot mastermind setup.
# orchestrator + researcher + executor + reviewer agents on Telegram.
#
# Usage:
#   Coolify "Docker Compose" resource pointing at:
#     Repo:   https://github.com/mdcnick/spacebot
#     Branch: local/spacebot-fix/2026-08-05-toggle-radix-state-fix
#     Compose path: deploy/coolify/docker-compose.yml
#
#   Env vars to set in Coolify:
#     OPENAI_API_KEY     — your OpenAI API key
#     TELEGRAM_BOT_TOKEN — your Telegram bot token from @BotFather
#
#   Local:
#     OPENAI_API_KEY=sk-... TELEGRAM_BOT_TOKEN=... docker compose -f deploy/coolify/docker-compose.yml up --build

services:
  spacebot:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: spacebot
    restart: unless-stopped
    ports:
      - "19898:19898"
    volumes:
      - spacebot-data:/data
      - ./config.toml:/data/config.toml:ro
      - ./agents/orchestrator/SOUL.md:/data/agents/orchestrator/SOUL.md:ro
      - ./agents/orchestrator/IDENTITY.md:/data/agents/orchestrator/IDENTITY.md:ro
      - ./agents/orchestrator/ROLE.md:/data/agents/orchestrator/ROLE.md:ro
      - ./agents/researcher/SOUL.md:/data/agents/researcher/SOUL.md:ro
      - ./agents/researcher/IDENTITY.md:/data/agents/researcher/IDENTITY.md:ro
      - ./agents/researcher/ROLE.md:/data/agents/researcher/ROLE.md:ro
      - ./agents/executor/SOUL.md:/data/agents/executor/SOUL.md:ro
      - ./agents/executor/IDENTITY.md:/data/agents/executor/IDENTITY.md:ro
      - ./agents/executor/ROLE.md:/data/agents/executor/ROLE.md:ro
      - ./agents/reviewer/SOUL.md:/data/agents/reviewer/SOUL.md:ro
      - ./agents/reviewer/IDENTITY.md:/data/agents/reviewer/IDENTITY.md:ro
      - ./agents/reviewer/ROLE.md:/data/agents/reviewer/ROLE.md:ro
    environment:
      - SPACEBOT_DIR=/data
      - SPACEBOT_DEPLOYMENT=docker
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}

volumes:
  spacebot-data:
